# KAIST Multispectral Pedestrian Dataset Configuration
dataset:
  name: kaist
  root: data/kaist
  modalities: [rgb, thermal]
  split_file: data/kaist/splits.txt

  # Image dimensions (KAIST native resolution)
  img_height: 256
  img_width: 320

  # Pedestrian detection only for KAIST
  num_classes: 1
  class_names: [person]

  # Annotation format
  annotation_format: kaist  # custom XML per image pair

preprocessing:
  mean_rgb: [0.3465, 0.3219, 0.2842]
  std_rgb:  [0.2358, 0.2265, 0.2274]
  mean_thermal: [0.1598]
  std_thermal:  [0.0813]

augmentation:
  horizontal_flip: true
  random_crop: true
  crop_size: [512, 640]
  color_jitter: true        # RGB only
  noise_injection: true     # for fault simulation
  noise_std: 0.05

dataloader:
  batch_size: 2             # safe for 6GB VRAM
  num_workers: 2            # Windows safe value
  pin_memory: true
  shuffle_train: true

fault_injection:
  enabled: true
  modes:
    - dropout
    - gaussian_noise
    - occlusion
    - blur
  dropout_prob: 0.15
  noise_std: 0.05